name: Keep Backend Alive

on:
  schedule:
    # Jalankan setiap 10 menit (Render sleep setelah 15 menit idle)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions di GitHub

jobs:
  ping:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        env:
          # Atur secret RENDER_BACKEND_URL di Settings > Secrets > Actions
          # atau gunakan fallback URL default jika belum diatur
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://famloc-api.onrender.com' }}
        run: |
          echo "Pinging ${BACKEND_URL}/api/v1/health ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${BACKEND_URL}/api/v1/health")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Backend is awake and healthy! (Status: $HTTP_STATUS)"
          else
            echo "Backend returned status $HTTP_STATUS or failed to respond in time."
            # Tetap exit 0 agar cron tidak dianggap failing run saat cold start
            exit 0
          fi
